<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <title>주문 목록 조회</title>
</head>
<body class="container py-5">
<div class="mx-auto" style="max-width: 920px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">주문 목록 조회</h2>
        <div class="d-flex gap-2">
            <a href="/admin/orders" class="btn btn-outline-dark">전체 주문 관리</a>
            <a href="/" class="btn btn-outline-secondary">메인으로</a>
        </div>
    </div>

    <div class="card p-3 mb-3">
        <label for="email" class="form-label">이메일</label>
        <div class="d-flex gap-2">
            <input id="email" type="email" class="form-control" placeholder="example@email.com">
            <button id="searchBtn" class="btn btn-dark">조회</button>
        </div>
        <div class="small text-muted mt-2">입력하신 이메일로 등록된 실시간 주문 상태를 서버에서 조회합니다.</div>
    </div>

    <div id="message" class="mb-3 text-muted"></div>
    <div id="resultList" class="d-flex flex-column gap-3"></div>
</div>

<script>
    const emailInput = document.getElementById('email');
    const searchBtn = document.getElementById('searchBtn');
    const message = document.getElementById('message');
    const resultList = document.getElementById('resultList');

    function formatPrice(value) {
        return Number(value || 0).toLocaleString() + '원';
    }

    function formatDate(value) {
        if (!value) return '-';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleString('ko-KR');
    }

    // 서버에서 받아온 데이터를 화면에 그리는 함수
    function renderOrders(orders) {
        if (!orders.length) {
            message.textContent = '조회 결과가 없습니다.';
            resultList.innerHTML = '';
            return;
        }

        message.textContent = '조회 결과 ' + orders.length + '건';
        resultList.innerHTML = orders.map(function (order) {
            const itemsHtml = (order.items || []).map(function (item) {
                return '' +
                    '<li class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<span>' + item.name + ' x ' + item.quantity + '</span>' +
                    '<span>' + formatPrice(item.price * item.quantity) + '</span>' +
                    '</li>';
            }).join('');

            return '' +
                '<div class="card p-3 shadow-sm">' +
                '<div class="d-flex justify-content-between align-items-start mb-2">' +
                '<div>' +
                '<div><b>주문번호:</b> ' + order.orderId + '</div>' +
                '<div><b>이메일:</b> ' + order.email + '</div>' +
                '<div><b>주소:</b> ' + order.address + '</div>' +
                '<div><b>우편번호:</b> ' + order.postCode + '</div>' +
                '</div>' +
                '<div class="text-end">' +
                '<div><b>상태:</b> ' + order.status + '</div>' +
                '<div><b>최종 업데이트:</b> ' + formatDate(order.updatedTime) + '</div>' +
                '<div><b>총금액:</b> ' + formatPrice(order.totalPrice) + '</div>' +
                '</div>' +
                '</div>' +
                '<ul class="list-group">' + itemsHtml + '</ul>' +
                '</div>';
        }).join('');
    }

    // 서버 API를 직접 호출하여 데이터를 필터링하는 함수
    async function searchOrders() {
        const email = emailInput.value.trim();
        if (!email) {
            message.textContent = '이메일을 입력해 주세요.';
            resultList.innerHTML = '';
            return;
        }

        message.textContent = '데이터를 불러오는 중...';

        try {
            // OrderController의 getAllOrders API 호출
            const response = await fetch('/api/orders');
            if (!response.ok) throw new Error('서버 응답 오류');

            const allOrders = await response.json();

            // 사용자가 입력한 이메일과 일치하는 주문만 필터링
            const filteredOrders = allOrders.filter(order =>
                order.email.toLowerCase() === email.toLowerCase()
            );

            // 최신순 정렬
            filteredOrders.sort((a, b) => b.orderId - a.orderId);

            renderOrders(filteredOrders);
        } catch (error) {
            console.error('Fetch error:', error);
            message.textContent = '데이터를 불러오지 못했습니다. 서버 상태를 확인하세요.';
        }
    }

    searchBtn.addEventListener('click', searchOrders);
    emailInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            searchOrders();
        }
    });
</script>
</body>
</html>
