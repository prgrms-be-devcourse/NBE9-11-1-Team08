<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <title>관리자 - 전체 주문 목록</title>
</head>
<body class="container py-5">
<div class="mx-auto" style="max-width: 920px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">전체 주문 관리 (관리자)</h2>
        <div>
            <a href="/orders" class="btn btn-outline-dark">주문 목록 조회</a>
            <a href="/" class="btn btn-outline-secondary">메인으로</a>
        </div>
    </div>

    <div class="card p-3 mb-3 text-center bg-light">
        <div id="statusMessage" class="fw-bold text-muted">주문 내역을 불러오는 중...</div>
    </div>

    <div id="resultList" class="d-flex flex-column gap-3"></div>
</div>

<script>
    const resultList = document.getElementById('resultList');
    const statusMessage = document.getElementById('statusMessage');

    function formatPrice(value) {
        return Number(value || 0).toLocaleString() + '원';
    }

    function formatDate(value) {
        if (!value) return '-';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleString('ko-KR');
    }

    async function loadAllOrders() {
        try {
            const response = await fetch('/api/orders');
            if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');

            let orders = await response.json();

            // 1. 내림차순 정렬 (ID 기준 또는 최신 업데이트 시각 기준)
            orders.sort((a, b) => b.orderId - a.orderId);

            renderOrders(orders);
        } catch (error) {
            statusMessage.textContent = '오류 발생: ' + error.message;
            statusMessage.classList.add('text-danger');
        }
    }

    function renderOrders(orders) {
        if (!orders.length) {
            statusMessage.textContent = '현재 등록된 주문이 없습니다.';
            resultList.innerHTML = '';
            return;
        }

        statusMessage.textContent = '전체 주문 내역: ' + orders.length + '건';

        resultList.innerHTML = orders.map(function (order) {
            const itemsHtml = (order.items || []).map(function (item) {
                return '' +
                    '<li class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<span>' + item.name + ' x ' + item.quantity + '</span>' +
                    '<span>' + formatPrice(item.price * item.quantity) + '</span>' +
                    '</li>';
            }).join('');

            return '' +
                '<div class="card p-3 shadow-sm">' +
                '<div class="d-flex justify-content-between align-items-start mb-2">' +
                '<div>' +
                '<div><b>주문번호:</b> ' + order.orderId + '</div>' +
                '<div><b>이메일:</b> ' + order.email + '</div>' +
                '<div><b>우편번호:</b> ' + order.postCode + '</div>' +
                '</div>' +
                '<div class="text-end">' +
                '<div><b>상태:</b> ' + order.status + '</div>' +
                '<div><b>주문시각:</b> ' + formatDate(order.updatedTime) + '</div>' + // 가장 나중 시각 표시
                '<div><b>총금액:</b> ' + formatPrice(order.totalPrice) + '</div>' +
                '</div>' +
                '</div>' +
                '<ul class="list-group">' + itemsHtml + '</ul>' +
                '</div>';
        }).join('');
    }

    window.onload = loadAllOrders;
</script>
</body>
</html>
